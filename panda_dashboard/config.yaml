name: Panda Dashboard
version: "0.3.79"
slug: panda_dashboard
description: Wall-tablet dashboard for the house — energy, rooms, car, doorbell and vacuum
url: https://github.com/Suchabadpanda/Panda-Dashboard
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: Panda Dashboard
# Every Home Assistant user gets the sidebar entry; only the people in config.js controlBy
# (else administrators) can use the controls. Everyone else sees a view-only dashboard.
panel_admin: false
# Your config.js lives here: \\homeassistant.local\app_configs\<id>_panda_dashboard\
map:
  - addon_config:ro

# Edit these in Settings → Add-ons → Panda Dashboard → Configuration.
# Add a row whenever a rate changes; each row applies from its date until the next one.
# Rates are £ per kWh including VAT (7.6p = 0.076); standing charge is £ per day.
options:
  tariff_name: ""
  tariffs:
    - from: "2025-10-29"
      off_peak: 0.076
      peak: 0.2666
      export: 0.165
      standing: 0.60
      off_peak_start: 0
      off_peak_end: 6
schema:
  tariff_name: str?
  tariffs:
    - from: match(^\d{4}-\d{2}-\d{2}$)
      off_peak: float(0,2)
      peak: float(0,2)
      export: float(0,2)
      standing: float(0,5)
      off_peak_start: int(0,23)
      off_peak_end: int(0,24)
