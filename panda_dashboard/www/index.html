<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17212c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Panda Dashboard</title>
  <link href="css/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <div id="top" class="top"></div>
    <div class="top-right">
      <nav id="nav" class="nav" aria-label="Views"></nav>
      <span id="status-slot"></span>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="doorbell-alert" class="doorbell-alert" hidden></div>
  <dialog id="doorbell-live" class="doorbell-live"></dialog>

  <dialog id="settings" class="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <p id="set-status" class="note"></p>
      <label>Home Assistant address
        <input id="set-url" type="url" placeholder="Leave blank when served by Home Assistant" autocomplete="off">
      </label>
      <label>Long-lived access token
        <input id="set-token" type="password" autocomplete="off">
        <small>Only needed when the dashboard isn't served from Home Assistant. Create one in HA under your profile → Security. It stays in this browser.</small>
      </label>
      <section class="tariff-info">
        <h3>Electricity tariff</h3>
        <label class="tariff-name">Tariff name <input id="tariff-name" type="text" placeholder="e.g. E.ON Next Drive" autocomplete="off"></label>
        <div id="set-tariff" class="table-scroll"></div>
        <div class="tariff-actions">
          <button type="button" class="btn ghost" id="tariff-add">Add rate change</button>
          <button type="button" class="btn" id="tariff-save">Save tariff</button>
        </div>
        <small id="set-tariff-where"></small>
      </section>
      <fieldset>
        <legend>Theme</legend>
        <label><input type="radio" name="theme" value="auto"> Match device</label>
        <label><input type="radio" name="theme" value="dark"> Dark</label>
        <label><input type="radio" name="theme" value="light"> Light</label>
      </fieldset>
      <fieldset class="palette-set">
        <legend>Colours</legend>
        <div id="palettes" class="palettes" role="radiogroup" aria-label="Colour theme"></div>
        <label class="accent-pick"><input type="checkbox" id="accent-on"> Own accent colour <input type="color" id="accent" value="#8fb8ff" aria-label="Accent colour"></label>
        <small>Saved on this screen. Changes show straight away; Close without saving puts them back.</small>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="set-demo">Show demo</button>
        <button type="button" class="btn ghost" id="set-forget">Forget token</button>
        <span></span>
        <button value="cancel" class="btn ghost">Close</button>
        <button value="save" class="btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <!-- Your own settings, kept out of git: the add-on's config folder, or data/ when copied into /config/www -->
  <script>document.write('<script src="data/config.js?t=' + Date.now() + '"><\/script>');</script>
  <script src="js/util.js"></script>
  <script src="js/ha.js"></script>
  <script src="js/tariff.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/data.js"></script>
  <script src="js/doorbell.js"></script>
  <script src="js/vacuum.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/battery.js"></script>
  <script src="js/carbon.js"></script>
  <script src="js/heatpump.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/dishwasher.js"></script>
  <script src="js/aircon.js"></script>
  <script src="js/trv.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/plan.js"></script>
  <script src="js/views/energy.js"></script>
  <script src="js/views/rooms.js"></script>
  <script src="js/views/car.js"></script>
  <script src="js/views/devices.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
