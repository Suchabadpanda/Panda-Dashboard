# Served through Home Assistant ingress only (sidebar panel, behind HA login).
server {
  listen 8099;
  allow 172.30.32.2;   # HA ingress proxy
  deny all;

  root /usr/share/nginx/html;
  index index.html;

  # Add-on options (tariffs) from the Configuration tab
  location = /options.json {
    alias /data/options.json;
    add_header Cache-Control "no-cache" always;
  }

  # Personal settings (config.js) from the add-on's config folder
  location ^~ /data/ {
    alias /config/;
    add_header Cache-Control "no-cache" always;
  }

  # Always pick up a new version straight after an update
  location ~* \.(html|js|css)$ {
    add_header Cache-Control "no-cache";
  }
}
