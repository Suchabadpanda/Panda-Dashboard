# Host the dashboard on the NAS instead of inside Home Assistant.
# Cross-origin, so it needs a long-lived token (entered in the dashboard's Settings)
# and HA must allow this origin — add to configuration.yaml:
#
#   http:
#     cors_allowed_origins:
#       - http://your-nas.local:8090
#
services:
  home-dashboard:
    image: nginx:alpine
    container_name: home-dashboard
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ../home_dashboard/www/index.html:/usr/share/nginx/html/index.html:ro
      - ../home_dashboard/www/css:/usr/share/nginx/html/css:ro
      - ../home_dashboard/www/js:/usr/share/nginx/html/js:ro
      - ../data:/usr/share/nginx/html/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
