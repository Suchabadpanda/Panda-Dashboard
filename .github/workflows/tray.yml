# Builds the Windows installer for Panda Tray (tray/) and publishes it as a GitHub release.
# Release a new version: bump "version" in tray/package.json and commit, then either push a
# tag v<version> (e.g. v1.0.1) or run this workflow from the Actions tab with "Publish a
# release" ticked. The app updates itself from these releases.
name: Panda Tray

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['tray/**']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (tag v<version> from tray/package.json)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tray
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tray/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but package.json says $want"; exit 1; }

      - name: Build the installer
        run: npx electron-builder --win nsis --publish never

      # One release per version, made here rather than by electron-builder (which can race
      # itself into two releases with the same tag). Re-running replaces that version's release.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(node -p "require('./package.json').version"); tag="v$ver"
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name==\"$tag\") | .id"); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
          done
          gh release create "$tag" dist/*.exe dist/*.blockmap dist/latest.yml \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Panda Tray $ver" \
            --notes "Windows installer for Panda Tray $ver. Download Panda-Tray-Setup-$ver.exe and run it; installed copies update themselves."

      - uses: actions/upload-artifact@v4
        with:
          name: panda-tray-installer
          path: tray/dist/*.exe
          if-no-files-found: error
